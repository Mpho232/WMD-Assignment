<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Koffiee | Login</title>

<style>

/* Same global styles as index.html */

.body-section {
    padding: 60px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
}

/* LOGIN CARD */

.login-card {
    background: #8b5e3c;
    border-radius: 20px;
    padding: 45px 40px;
    width: 100%;
    max-width: 420px;
    text-align: center;
}

.login-card h2 {
    color: white;
    font-size: 34px;
    margin-bottom: 8px;
}

.login-card p {
    color: #f5deb3;
    font-size: 15px;
    margin-bottom: 30px;
}

/* FORM INPUTS */

.form-group {
    margin-bottom: 20px;
    text-align: left;
}

.form-group label {
    display: block;
    color: #d4a373;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
}

.form-group input {
    width: 100%;
    padding: 13px 15px;
    border-radius: 10px;
    border: 2px solid #d4a373;
    background: #5c3317;
    color: white;
    font-size: 15px;
    outline: none;
    transition: 0.3s;
}

.form-group input:focus {
    border-color: white;
    background: #6f4e37;
}

.form-group input::placeholder {
    color: #c9a87a;
}

/* LOGIN SUBMIT BUTTON */

.login-submit {
    width: 100%;
    background: #d4a373;
    color: white;
    border: none;
    padding: 15px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

.login-submit:hover {
    background: white;
    color: #3e2413;
}

/* REGISTER LINK */

.register-link {
    margin-top: 20px;
    color: #f5deb3;
    font-size: 14px;
}

.register-link a {
    color: #d4a373;
    font-weight: bold;
    text-decoration: none;
}

.register-link a:hover {
    color: white;
}

/* FORGOT PASSWORD */

.forgot {
    text-align: right;
    margin-top: -12px;
    margin-bottom: 20px;
}

.forgot a {
    color: #d4a373;
    font-size: 13px;
    text-decoration: none;
}

.forgot a:hover {
    color: white;
}

@media(max-width: 900px) {
    .login-card { padding: 30px 22px; }
}

</style>

</head>
<body>
<div class="container">

    <header class="header">
        <div class="logo-section">
            <img src="images/logo.jpg" alt="Quick Koffiee Logo">
            <h1>Quick Koffiee</h1>
        </div>
        <a href="login.html" class="login-btn">Login</a>
    </header>

    <!-- No active link for login since it's not in the navbar -->
    <nav class="navbar" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html">Cart</a>
    </nav>

    <main class="body-section">

        <div class="login-card">

            <h2>Welcome Back ☕</h2>
            <p>Login to your Quick Koffiee account</p>

            <form>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="forgot">
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>

            <div class="register-link">
                Don't have an account?
                <a href="#">Register here</a>
            </div>

        </div>

    </main>

    <footer class="footer">
        &copy; 2025 Quick Koffiee. All Rights Reserved.
    </footer>

</div>
</body>
</html>
