<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Koffiee | Cart</title>

<style>

/* Same global styles as index.html */

.body-section {
    padding: 40px 50px;
}

.page-title {
    color: white;
    font-size: 38px;
    margin-bottom: 30px;
}

/* CART TABLE */

.cart-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 30px;
}

.cart-table th {
    background: #3e2413;
    color: #d4a373;
    padding: 15px;
    text-align: left;
    font-size: 16px;
}

.cart-table td {
    background: #8b5e3c;
    color: white;
    padding: 15px;
    border-bottom: 2px solid #5c3317;
    font-size: 15px;
}

.cart-table td img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 10px;
}

/* QUANTITY CONTROLS */

.qty-controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

.qty-btn {
    background: #d4a373;
    color: white;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
}

.qty-btn:hover {
    background: white;
    color: #5c3317;
}

.qty-num {
    color: white;
    font-size: 18px;
    font-weight: bold;
    min-width: 20px;
    text-align: center;
}

/* REMOVE BUTTON */

.remove-btn {
    background: #c0392b;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.remove-btn:hover {
    background: #e74c3c;
}

/* CART SUMMARY */

.cart-summary {
    background: #8b5e3c;
    border-radius: 20px;
    padding: 25px;
    max-width: 400px;
    margin-left: auto;
}

.cart-summary h2 {
    color: white;
    font-size: 26px;
    margin-bottom: 20px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    color: #f5f5f5;
    font-size: 16px;
    margin-bottom: 12px;
}

.summary-row.total {
    color: #d4a373;
    font-size: 22px;
    font-weight: bold;
    border-top: 2px solid #d4a373;
    padding-top: 12px;
    margin-top: 8px;
}

.checkout-btn {
    width: 100%;
    background: #d4a373;
    color: white;
    border: none;
    padding: 15px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
    transition: 0.3s;
}

.checkout-btn:hover {
    background: white;
    color: #3e2413;
}

/* EMPTY CART MESSAGE */

.empty-cart {
    text-align: center;
    color: #f5deb3;
    font-size: 22px;
    padding: 60px 0;
}

.empty-cart a {
    display: inline-block;
    margin-top: 20px;
    background: #d4a373;
    color: white;
    padding: 12px 28px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

.empty-cart a:hover {
    background: white;
    color: #3e2413;
}

@media(max-width: 900px) {
    .body-section { padding: 20px; }
    .cart-table { font-size: 13px; }
    .cart-table th, .cart-table td { padding: 10px 8px; }
    .cart-summary { max-width: 100%; }
}

</style>

</head>
<body>
<div class="container">

    <header class="header">
        <div class="logo-section">
            <img src="images/logo.jpg" alt="Quick Koffiee Logo">
            <h1>Quick Koffiee</h1>
        </div>
        <a href="login.html" class="login-btn">Login</a>
    </header>

    <!-- NAVBAR — "Cart" is active -->
    <nav class="navbar" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html" class="active">Cart</a>
    </nav>

    <main class="body-section">

        <h1 class="page-title">🛒 Your Cart</h1>

        <!-- CART ITEMS TABLE -->
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Remove</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><img src="images/espresso.jpg" alt="Espresso"></td>
                    <td>Espresso</td>
                    <td>P15.00</td>
                    <td>
                        <div class="qty-controls">
                            <button class="qty-btn">−</button>
                            <span class="qty-num">1</span>
                            <button class="qty-btn">+</button>
                        </div>
                    </td>
                    <td>P15.00</td>
                    <td><button class="remove-btn">Remove</button></td>
                </tr>
                <tr>
                    <td><img src="images/iced.jpg" alt="Iced Coffee"></td>
                    <td>Iced Coffee</td>
                    <td>P30.00</td>
                    <td>
                        <div class="qty-controls">
                            <button class="qty-btn">−</button>
                            <span class="qty-num">2</span>
                            <button class="qty-btn">+</button>
                        </div>
                    </td>
                    <td>P60.00</td>
                    <td><button class="remove-btn">Remove</button></td>
                </tr>
            </tbody>
        </table>

        <!-- ORDER SUMMARY -->
        <div class="cart-summary">
            <h2>Order Summary</h2>
            <div class="summary-row">
                <span>Subtotal</span>
                <span>P75.00</span>
            </div>
            <div class="summary-row">
                <span>VAT (14%)</span>
                <span>P10.50</span>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <span>P85.50</span>
            </div>
            <button class="checkout-btn">Proceed to Checkout</button>
        </div>

    </main>

    <footer class="footer">
        &copy; 2025 Quick Koffiee. All Rights Reserved.
    </footer>

</div>
</body>
  </html>
