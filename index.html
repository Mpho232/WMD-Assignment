<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Menu | M.R Foods</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#f5f5f5;
    }

    /* NAVBAR */

    .navbar{
      width:100%;
      height:80px;
      background:#111;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 8%;
    }

    .navbar h1{
      color:#ff7b00;
    }

    .navbar nav a{
      color:white;
      text-decoration:none;
      margin-left:20px;
    }

    /* MENU PAGE */

    .menu-page{
      width:100%;
      padding:50px;
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
      gap:30px;
    }

    /* MENU BOXES */

    .menu-box{
      background:white;
      border:3px solid #ff7b00;
      border-radius:15px;
      overflow:hidden;
      text-align:center;
      padding-bottom:20px;
      transition:0.3s;
    }

    .menu-box:hover{
      transform:translateY(-10px);
    }

    .menu-box img{
      width:100%;
      height:250px;
      object-fit:cover;
    }

    .menu-box h2{
      margin:20px 0;
    }

    .menu-box a{
      text-decoration:none;
      background:#ff7b00;
      color:white;
      padding:10px 20px;
      border-radius:30px;
    }

  </style>

</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">

    <h1>M.R Foods</h1>

    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="cart.html">Cart</a>
    </nav>

  </header>

  <!-- MENU CONTAINER -->
  <section class="menu-page">

    <div class="menu-box">
      <img src="images/burger.jpg" alt="Burger">
      <h2>Burgers</h2>
      <a href="burgers.html">View More</a>
    </div>

    <div class="menu-box">
      <img src="images/fries.jpg" alt="Fries">
      <h2>French Fries</h2>
      <a href="fries.html">View More</a>
    </div>

    <div class="menu-box">
      <img src="images/quesadilla.jpg" alt="Quesadilla">
      <h2>Quesadillas</h2>
      <a href="quesadillas.html">View More</a>
    </div>

    <div class="menu-box">
      <img src="images/russian.jpg" alt="Hotdogs">
      <h2>Hotdogs</h2>
      <a href="hotdogs.html">View More</a>
    </div>

  </section>

</body>
</html>
