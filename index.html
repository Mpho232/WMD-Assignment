<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>M.R Foods</title>

  <link rel="stylesheet" href="style.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >
</head>

<body>

  <!-- TOP NAVBAR -->

  <header class="navbar">

    <div class="logo">
      M.R Foods
    </div>

    <div class="menu-btn" id="menu-btn">
      <i class="fa-solid fa-bars"></i>
    </div>

  </header>

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">

      <h2>M.R Foods</h2>

      <i class="fa-solid fa-xmark" id="close-btn"></i>

    </div>

    <ul class="sidebar-links">

      <!-- MENU -->

      <li>

        <button class="dropdown-btn">
          Menu
          <i class="fa-solid fa-chevron-down"></i>
        </button>

        <ul class="dropdown">

          <li><a href="#">Burgers</a></li>

          <li><a href="#">Fries</a></li>

          <li><a href="#">Quesadillas</a></li>

          <!-- HOTDOGS DROPDOWN -->

          <li>

            <button class="dropdown-btn inner-btn">
              Hotdogs
              <i class="fa-solid fa-chevron-down"></i>
            </button>

            <ul class="dropdown inner-dropdown">

              <li><a href="#">Russian Hotdog</a></li>

              <li><a href="#">Boerwors Hotdog</a></li>

            </ul>

          </li>

          <li><a href="#">Drinks</a></li>

        </ul>

      </li>

      <!-- CART -->

      <li>

        <button class="dropdown-btn">
          Cart
          <i class="fa-solid fa-chevron-down"></i>
        </button>

        <ul class="dropdown">

          <li><a href="#">Checkout</a></li>

          <!-- PAYMENT OPTIONS -->

          <li>

            <button class="dropdown-btn inner-btn">
              Payment Options
              <i class="fa-solid fa-chevron-down"></i>
            </button>

            <ul class="dropdown inner-dropdown">

              <li><a href="#">FNB Pay2Cell</a></li>

              <li><a href="#">Orange Money</a></li>

              <li><a href="#">MyZaka</a></li>

              <li><a href="#">Smega</a></li>

            </ul>

          </li>

        </ul>

      </li>

    </ul>

  </aside>

  <!-- MAIN CONTENT -->

  <main class="hero">

    <div class="hero-content">

      <h1>Fresh. Fast. Flavorful.</h1>

      <p>
        Pickup meals made for BAC students.
      </p>

      <button class="hero-btn">
        Order Now
      </button>

    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
